<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karen</title>
<link rel="icon" href="/icon.png" type="image/png">
<style>
  /* Karen palette: navy #1e3a6f, sage #668679, blue #4e6dd6, royal #2b44a5, olive #65852f */
  :root {
    --bg: #eef1f8; --card: #e1e7f3; --text: #13244a; --muted: #4f6a5e; --line: #c9d3e8;
    --up: #65852f; --down: #c94040; --warn: #b7800a; --accent: #2b44a5; --bar: #c9d3e8;
    --on-pill: #fff;
    /* Karen's screen stays dark in both themes, like the monitor it is */
    --screen: #0b1633; --screen-text: #e3e9f6; --screen-muted: #8ba89a; --screen-line: #1e3a6f; --phosphor: #b9d67f;
    --log-dim: #6f8a7d; --log-err: #ff7b7b; --log-warn: #e8b64a; --log-sha: #8fa6ff;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --radius: 4px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c1530; --card: #132550; --text: #e6ebf5; --muted: #8ba89a; --line: #1e3a6f;
      --up: #85a947; --down: #ef6464; --warn: #e0a72e; --accent: #4e6dd6; --bar: #1e3a6f;
      --on-pill: #0c1530;
      --screen: #070e22;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; line-height: 1; margin: 0; }
  .title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .spacer { flex: 1; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; }
  code { font-family: var(--mono); font-size: 12px; }
  .pill { display: inline-block; padding: 0 7px; border-radius: var(--radius); font-size: 11px; font-weight: 600; line-height: 18px; color: var(--on-pill); white-space: nowrap; }
  .pill.up { background: var(--up); } .pill.down { background: var(--down); } .pill.warn { background: var(--warn); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--up); }
  .dot.down { background: var(--down); } .dot.warn { background: var(--warn); } .dot.off { background: var(--muted); }
  button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: var(--radius); padding: 2px 9px; cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* System: one strip of stats */
  .stats { display: flex; flex-wrap: wrap; }
  .stat { padding: 8px 14px; border-right: 1px solid var(--line); min-width: 0; }
  .stat:last-child { border-right: 0; }
  .stat.grow { flex: 1; min-width: 140px; }
  .stat .k { display: block; font-size: 12px; color: var(--muted); }
  .stat .v { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .bar { height: 4px; background: var(--bar); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); }

  /* Console: project list on the left, Karen's screen on the right. The selected row takes the
     screen's color and runs flush into it, so it reads as the tab the screen is showing. */
  .console { display: grid; grid-template-columns: minmax(280px, 400px) minmax(0, 1fr); overflow: hidden; }
  .list { padding: 8px 0 8px 8px; display: flex; flex-direction: column; gap: 2px; }
  .prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 9px 14px 9px 12px; border-radius: var(--radius) 0 0 var(--radius); cursor: pointer; }
  .prow:hover { background: var(--bg); }
  .prow.sel { background: var(--screen); color: var(--screen-text); }
  .prow.sel .muted { color: var(--screen-muted); }
  .prow.sel button { background: transparent; color: var(--screen-text); border-color: var(--screen-line); }
  .pname { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .pname .pn { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .pname b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pname .sha { font-size: 11px; }
  .pstate { font-size: 13px; text-align: right; white-space: nowrap; }
  .pcommit { min-width: 0; font-size: 13px; }
  .pcommit > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pcommit .pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .prow button { justify-self: end; }
  .prow.updater .pname b { font-weight: 400; }
  .screen { background: var(--screen); color: var(--screen-muted); display: flex; flex-direction: column; min-width: 0; }
  .screen-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px 0; font: 12px var(--mono); }
  .screen select { font: 12px var(--mono); background: transparent; color: var(--screen-muted); border: 1px solid var(--screen-line); border-radius: var(--radius); padding: 1px 4px; }
  .screen select option { background: var(--screen); }
  pre { flex: 1 1 auto; margin: 0; padding: 10px 14px 14px; font: 12px/1.55 var(--mono); color: var(--phosphor); height: max(360px, 55vh); overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; scrollbar-color: var(--screen-line) transparent; }
  pre .dim { color: var(--log-dim); } pre .err { color: var(--log-err); } pre .warn { color: var(--log-warn); } pre .sha { color: var(--log-sha); }
  @media (max-width: 760px) {
    .console { grid-template-columns: 1fr; }
    .list { padding: 8px; }
    .prow { border-radius: var(--radius); }
    .pcommit > div { white-space: normal; }
  }

  /* Services: chips, failed ones first */
  .services { padding: 10px 14px 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font: 12px var(--mono); padding: 2px 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); }
  .chip.failed { border-color: var(--down); color: var(--down); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/icon.png" alt="" height="36">
    <div class="title">
      <h1>Karen</h1>
      <span class="muted"><span id="host"></span> <span id="updated">loading…</span></span>
    </div>
  </header>
  <section class="stats" id="sys"></section>
  <section class="console">
    <div class="list" id="projects"></div>
    <div class="screen">
      <div class="screen-head">
        <span id="logTitle"></span>
        <span class="spacer"></span>
        <select id="lines" aria-label="Log lines"><option value="50">50 lines</option><option value="100" selected>100 lines</option><option value="250">250 lines</option><option value="500">500 lines</option></select>
      </div>
      <pre id="log"></pre>
    </div>
  </section>
  <section class="services">
    <h2 id="svcCount">Services</h2>
    <div class="chips" id="svc"></div>
  </section>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const gb = (b) => (b / 1024 ** 3).toFixed(1);
const UPDATER = 'karen-update';

function ago(ms) {
  if (!ms) return 'never';
  let s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  return dur(s) + ' ago';
}
function dur(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${m}m`;
  if (m) return `${m}m`;
  return `${Math.floor(s)}s`;
}
const pill = (cls, text) => `<span class="pill ${cls}">${esc(text)}</span>`;
const dot = (cls) => `<span class="dot ${cls}"></span>`;
const stat = (k, v, cls = '') => `<div class="stat ${cls}"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`;
const meter = (k, used, total) =>
  `<div class="stat grow"><span class="k">${k}</span><span class="v">${gb(used)} of ${gb(total)} GB</span>` +
  `<div class="bar"><div style="width:${(used / total * 100).toFixed(1)}%"></div></div></div>`;
const commit = (c) => `<code>${esc(c.hash.slice(0, 7))}</code> ${esc(c.subject)} <span class="muted">${ago(Date.parse(c.date))}</span>`;

function renderSys(s) {
  $('host').textContent = `on ${s.hostname},`;
  const temp = s.tempC == null ? '' : stat('CPU temp',
    `${dot(s.tempC >= 80 ? 'down' : s.tempC >= 70 ? 'warn' : '')} ${s.tempC.toFixed(0)} °C`);
  $('sys').innerHTML =
    stat('Uptime', dur(s.uptime)) +
    stat('Load', `${s.load[0].toFixed(2)} <span class="muted">on ${s.cpus} cores</span>`) +
    meter('Memory', s.mem.total - s.mem.available, s.mem.total) +
    meter('Disk', s.disk.total - s.disk.available, s.disk.total) +
    temp;
}

// Rows are created once and only their details are re-rendered, so button state survives refreshes
function ensureRow(id, unit, button) {
  let row = document.getElementById(id);
  if (row) return row;
  row = document.createElement('div');
  row.className = 'prow';
  row.id = id;
  row.dataset.unit = unit;
  row.tabIndex = 0;
  row.innerHTML = `<div class="pname"></div><div class="pstate"></div><div class="pcommit"></div>${button}`;
  // Projects keep their order above the updater row, which is always last
  $('projects').insertBefore(row, unit === UPDATER ? null : document.getElementById('row-updater'));
  return row;
}

function renderProjects(list, au) {
  for (const p of list) {
    const row = ensureRow(`p-${p.service}`, p.service,
      `<button data-restart="${esc(p.service)}" data-name="${esc(p.name)}">Restart</button>`);
    const [cls, text] = !p.installed ? ['down', 'not installed']
      : p.active === 'active' ? ['', `up ${dur((Date.now() - p.since) / 1000)}`]
      : p.active === 'activating' || p.active === 'reloading' ? ['warn', p.active]
      : ['down', p.sub || p.active];
    row.querySelector('.pname').innerHTML = `${dot(cls)}<span class="pn"><b>${esc(p.name)}</b>` +
      (p.commit ? `<code class="sha muted">${esc(p.commit.hash.slice(0, 7))}</code>` : '') + '</span>';
    row.querySelector('.pstate').innerHTML = esc(text) +
      (p.restarts ? `<span class="muted" title="automatic restarts after crashing">, ${p.restarts} crashes</span>` : '');
    const behind = p.github && p.commit && p.commit.hash !== p.github.hash;
    const broken = !au.running && p.deployed && p.commit && p.deployed !== p.commit.hash;
    row.querySelector('.pcommit').innerHTML = !p.commit ? '<span class="muted">no git checkout found</span>'
      : `<div>${esc(p.commit.subject)} <span class="muted">${ago(Date.parse(p.commit.date))}</span></div>` +
        (behind ? `<div class="muted">GitHub has ${commit(p.github)}</div>` : '') +
        (behind || broken ? `<div class="pills">${behind ? pill('warn', 'update pending') : ''}${broken ? pill('down', 'update failed') : ''}</div>` : '');
  }

  const row = ensureRow('row-updater', UPDATER, '<button data-run>Run now</button>');
  row.classList.add('updater');
  const [cls, text] = !au.installed ? ['off', 'not installed']
    : au.running ? ['warn', 'running']
    : au.lastResult && au.lastResult !== 'success' ? ['down', `failed ${ago(au.lastRun)}`]
    : [au.active === 'active' ? '' : 'off', au.active === 'active' ? `ran ${ago(au.lastRun)}` : au.active];
  row.querySelector('.pname').innerHTML = `${dot(cls)}<span class="pn"><b>auto-updater</b></span>`;
  row.querySelector('.pstate').textContent = text;
  row.querySelector('.pcommit').innerHTML = '<span class="muted">Deploys new GitHub commits every minute</span>';
  markSelected();
}

function renderServices(list) {
  list.sort((a, b) => (b.active === 'failed') - (a.active === 'failed') || a.unit.localeCompare(b.unit, undefined, { sensitivity: 'base' }));
  const failed = list.filter((s) => s.active === 'failed').length;
  $('svcCount').textContent = `${list.length - failed} services running` + (failed ? `, ${failed} failed` : '');
  $('svc').innerHTML = list.map((s) => {
    const f = s.active === 'failed';
    return `<span class="chip ${f ? 'failed' : ''}" title="${esc(s.description)}">${dot(f ? 'down' : '')}${esc(s.unit)}</span>`;
  }).join('');
}

let lastAt = 0;
async function refresh() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    if (!unit) unit = d.projects[0]?.service || UPDATER;
    renderSys(d.system);
    renderProjects(d.projects, d.updater);
    renderServices(d.services);
    lastAt = d.at;
  } catch (e) {
    $('updated').textContent = `can't reach the Pi (${e.message})`;
  }
}
setInterval(() => { if (lastAt) $('updated').textContent = `updated ${ago(lastAt)}`; }, 1000);

let unit = null;
function markSelected() {
  $('projects').querySelectorAll('.prow').forEach((x) => x.classList.toggle('sel', x.dataset.unit === unit));
  $('logTitle').textContent = unit ? `journalctl -u ${unit}` : '';
}
async function refreshLog() {
  if (!unit) return;
  const pre = $('log');
  const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 20;
  try {
    const r = await fetch(`/api/logs?unit=${unit}&lines=${$('lines').value}`);
    const d = await r.json();
    pre.innerHTML = d.lines.map(highlight).join('\n');
    if (atBottom) pre.scrollTop = pre.scrollHeight;
  } catch {}
}
// Dims journalctl's "time host process[pid]:" prefix (and a leading ISO timestamp the app logged itself),
// colors error and warning lines, and picks out short commit SHAs
function highlight(line) {
  const m = line.match(/^(\S+ \S+ [^:]+: )(\d{4}-\d\d-\d\dT[\d:.]+Z )?(.*)$/);
  if (!m) return `<span class="dim">${esc(line)}</span>`;
  const [, prefix, ts = '', msg] = m;
  const cls = /\b(errors?|failed|fail|exception|denied)\b/i.test(msg) ? 'err' : /\bwarn(ing)?\b/i.test(msg) ? 'warn' : '';
  const body = esc(msg).replace(/\b(?=[0-9a-f]*[a-f])(?=[0-9a-f]*\d)[0-9a-f]{7}\b/g, '<span class="sha">$&</span>');
  return `<span class="dim">${esc(prefix + ts)}</span><span class="${cls}">${body}</span>`;
}
function showLog(u) {
  unit = u;
  markSelected();
  refreshLog().then(() => { $('log').scrollTop = $('log').scrollHeight; });
}
$('lines').addEventListener('change', refreshLog);

async function act(url, label, confirmText, btn) {
  if (!confirm(confirmText)) return;
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = `${label}…`;
  try {
    const r = await fetch(url, { method: 'POST', headers: { 'X-Dashboard': '1' } });
    const d = await r.json();
    if (!d.ok) alert(`${label} failed: ${d.error}`);
  } catch (e) {
    // Restarting Karen itself drops the connection before it can answer; the next refresh reconnects
  }
  btn.disabled = false;
  btn.textContent = original;
  refresh();
  refreshLog();
}
$('projects').addEventListener('click', (e) => {
  const restart = e.target.closest('[data-restart]');
  if (restart) return act(`/api/restart?service=${encodeURIComponent(restart.dataset.restart)}`, 'Restarting', `Restart ${restart.dataset.name}?`, restart);
  const run = e.target.closest('[data-run]');
  if (run) return act('/api/update', 'Running', 'Check GitHub and deploy new commits for every project now?', run);
  const row = e.target.closest('.prow');
  if (row) showLog(row.dataset.unit);
});
$('projects').addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('prow')) {
    e.preventDefault();
    showLog(e.target.dataset.unit);
  }
});

refresh().then(() => refreshLog()).then(() => { $('log').scrollTop = $('log').scrollHeight; });
setInterval(refresh, 10_000);
setInterval(refreshLog, 10_000);
</script>
</body>
</html>
