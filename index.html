<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karen</title>
<link rel="icon" href="/icon.png" type="image/png">
<style>
  /* Palette from lolswirl/portfolio's site.css */
  :root {
    --bg: #efefef; --card: #e4e4e4; --text: #212121; --muted: #6c6c6c; --line: #d6d6d6;
    --up: #1f9d55; --down: #d64545; --warn: #c98a00; --accent: #fb607f; --bar: #d6d6d6;
    --on-accent: #121212; --on-pill: #fff;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212; --card: #1f1f1f; --text: #f0f0f0; --muted: #ababab; --line: #383838;
      --up: #5ac539; --down: #ef6464; --warn: #e0a72e; --accent: #73ff48; --bar: #383838;
      --on-pill: #121212;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; line-height: 1; margin: 0; }
  .title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .spacer { flex: 1; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; min-width: 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 6px; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  h2 .count { text-transform: none; letter-spacing: 0; font-weight: 400; }
  code { font-family: var(--mono); font-size: 12px; }
  .pill { display: inline-block; padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 600; line-height: 18px; color: var(--on-pill); white-space: nowrap; }
  .pill.up { background: var(--up); } .pill.down { background: var(--down); } .pill.warn { background: var(--warn); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--up); }
  .dot.down { background: var(--down); } .dot.warn { background: var(--warn); } .dot.off { background: var(--muted); }
  button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 6px; padding: 3px 10px; cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  select { font: inherit; font-size: 13px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; }

  /* System: one strip of stats */
  .stats { display: flex; flex-wrap: wrap; padding: 0; }
  .stat { padding: 8px 14px; border-right: 1px solid var(--line); min-width: 0; }
  .stat:last-child { border-right: 0; }
  .stat.grow { flex: 1; min-width: 140px; }
  .stat .k { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .stat .v { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .bar { height: 4px; background: var(--bar); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); }

  /* Projects: one row each; clicking a row opens its log */
  .prow { display: grid; grid-template-columns: 150px 120px minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 7px 8px; margin: 0 -8px; border-radius: 6px; cursor: pointer; }
  .prow + .prow { border-top: 1px solid var(--line); border-top-left-radius: 0; border-top-right-radius: 0; }
  .prow:hover { background: var(--bg); }
  .prow.sel { box-shadow: inset 3px 0 0 var(--accent); }
  .pname { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
  .pname span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pstate { font-size: 13px; }
  .pcommit { min-width: 0; font-size: 13px; }
  .pcommit > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pcommit .pill { margin-left: 4px; }
  @media (max-width: 640px) {
    .prow { display: flex; flex-wrap: wrap; }
    .pname { flex: 1; }
    .pstate { order: 1; flex-basis: 100%; }
    .pcommit { order: 2; flex-basis: 100%; }
    .pcommit > div { white-space: normal; }
  }

  /* Services: chips, failed ones first */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font: 12px var(--mono); padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
  .chip.failed { border-color: var(--down); color: var(--down); }

  pre { margin: 0; font: 12px/1.5 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; height: max(320px, 55vh); overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/icon.png" alt="" height="36">
    <div class="title">
      <h1>Karen</h1>
      <span class="muted"><span id="host"></span> <span id="updated">loading…</span></span>
    </div>
    <span class="spacer"></span>
    <span class="muted" id="updateMsg"></span>
    <button id="update">Update all now</button>
  </header>
  <section class="stats" id="sys"></section>
  <section>
    <h2>Projects</h2>
    <div id="projects"></div>
  </section>
  <section>
    <h2>Services <span class="count" id="svcCount"></span></h2>
    <div class="chips" id="svc"></div>
  </section>
  <section>
    <h2>
      Logs
      <span class="spacer"></span>
      <span id="logTabs" style="display: contents"></span>
      <select id="lines"><option>50</option><option selected>100</option><option>250</option><option>500</option></select>
    </h2>
    <pre id="log"></pre>
  </section>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const gb = (b) => (b / 1024 ** 3).toFixed(1);

function ago(ms) {
  if (!ms) return 'never';
  let s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  return dur(s) + ' ago';
}
function dur(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${m}m`;
  if (m) return `${m}m`;
  return `${Math.floor(s)}s`;
}
const pill = (cls, text) => `<span class="pill ${cls}">${esc(text)}</span>`;
const dot = (cls) => `<span class="dot ${cls}"></span>`;
const stat = (k, v, cls = '') => `<div class="stat ${cls}"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`;
const meter = (k, used, total) =>
  `<div class="stat grow"><span class="k">${k}</span><span class="v">${gb(used)} / ${gb(total)} GB</span>` +
  `<div class="bar"><div style="width:${(used / total * 100).toFixed(1)}%"></div></div></div>`;
const commit = (c) => `<code>${esc(c.hash.slice(0, 7))}</code> ${esc(c.subject)} <span class="muted">${ago(Date.parse(c.date))}</span>`;

function renderSys(s, au) {
  $('host').textContent = `on ${s.hostname} ·`;
  document.title = `Karen · ${s.hostname}`;
  const auto = !au.installed ? `${dot('off')} not installed`
    : au.running ? `${dot('warn')} updating now`
    : au.lastResult && au.lastResult !== 'success' ? `${dot('down')} failed ${ago(au.lastRun)}`
    : `${dot(au.active === 'active' ? '' : 'off')} ${au.active === 'active' ? ago(au.lastRun) : esc(au.active)}`;
  const temp = s.tempC == null ? '' : stat('CPU temp',
    `${dot(s.tempC >= 80 ? 'down' : s.tempC >= 70 ? 'warn' : '')} ${s.tempC.toFixed(0)} °C`);
  $('sys').innerHTML =
    stat('Auto-update', auto) +
    stat('Uptime', dur(s.uptime)) +
    stat('Load', `${s.load[0].toFixed(2)} <span class="muted">/ ${s.cpus} cores</span>`) +
    meter('Memory', s.mem.total - s.mem.available, s.mem.total) +
    meter('Disk', s.disk.total - s.disk.available, s.disk.total) +
    temp;
}

// Rows are created once per project and only their details are re-rendered, so button state survives refreshes
function renderProjects(list, updating) {
  for (const p of list) {
    let row = document.getElementById(`p-${p.service}`);
    if (!row) {
      row = document.createElement('div');
      row.className = 'prow';
      row.id = `p-${p.service}`;
      row.dataset.unit = p.service;
      row.innerHTML = `<div class="pname"></div><div class="pstate"></div><div class="pcommit"></div>` +
        `<button data-restart="${esc(p.service)}" data-name="${esc(p.name)}">Restart</button>`;
      $('projects').appendChild(row);
    }
    const [cls, text] = !p.installed ? ['down', 'not installed']
      : p.active === 'active' ? ['', `up ${dur((Date.now() - p.since) / 1000)}`]
      : p.active === 'activating' || p.active === 'reloading' ? ['warn', p.active]
      : ['down', p.sub || p.active];
    row.querySelector('.pname').innerHTML = `${dot(cls)}<span>${esc(p.name)}</span>`;
    row.querySelector('.pstate').innerHTML = `${esc(text)}` +
      (p.restarts ? ` <span class="muted" title="automatic restarts after crashing">· ${p.restarts}×</span>` : '');
    const behind = p.github && p.commit && p.commit.hash !== p.github.hash;
    const broken = !updating && p.deployed && p.commit && p.deployed !== p.commit.hash;
    row.querySelector('.pcommit').innerHTML = !p.commit ? '<span class="muted">no git checkout</span>'
      : `<div>${commit(p.commit)}${behind ? pill('warn', 'update pending') : ''}${broken ? pill('down', 'update failed') : ''}</div>` +
        (behind ? `<div class="muted">GitHub: ${commit(p.github)}</div>` : '');
  }
  markSelected();
}

function renderServices(list) {
  list.sort((a, b) => (b.active === 'failed') - (a.active === 'failed') || a.unit.localeCompare(b.unit, undefined, { sensitivity: 'base' }));
  const failed = list.filter((s) => s.active === 'failed').length;
  $('svcCount').textContent = `· ${list.length - failed} running` + (failed ? ` · ${failed} failed` : '');
  $('svc').innerHTML = list.map((s) => {
    const f = s.active === 'failed';
    return `<span class="chip ${f ? 'failed' : ''}" title="${esc(s.description)}">${dot(f ? 'down' : '')}${esc(s.unit)}</span>`;
  }).join('');
}

function renderLogTabs(list) {
  if ($('logTabs').children.length) return;
  const tabs = [...list.map((p) => [p.service, p.name]), ['karen-update', 'Updates']];
  $('logTabs').innerHTML = tabs.map(([u, name]) => `<button data-unit="${esc(u)}">${esc(name)}</button>`).join('');
  markSelected();
}

let lastAt = 0;
async function refresh() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    if (!unit) unit = d.projects[0]?.service || 'karen-update';
    renderSys(d.system, d.updater);
    renderProjects(d.projects, d.updater.running);
    renderLogTabs(d.projects);
    renderServices(d.services);
    lastAt = d.at;
  } catch (e) {
    $('updated').textContent = `can't reach the Pi (${e.message})`;
  }
}
setInterval(() => { if (lastAt) $('updated').textContent = `updated ${ago(lastAt)}`; }, 1000);

let unit = null;
function markSelected() {
  $('logTabs').querySelectorAll('[data-unit]').forEach((x) => x.classList.toggle('on', x.dataset.unit === unit));
  $('projects').querySelectorAll('.prow').forEach((x) => x.classList.toggle('sel', x.dataset.unit === unit));
}
async function refreshLog() {
  if (!unit) return;
  const pre = $('log');
  const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 20;
  try {
    const r = await fetch(`/api/logs?unit=${unit}&lines=${$('lines').value}`);
    const d = await r.json();
    pre.textContent = d.lines.join('\n');
    if (atBottom) pre.scrollTop = pre.scrollHeight;
  } catch {}
}
function showLog(u) {
  unit = u;
  markSelected();
  refreshLog().then(() => { $('log').scrollTop = $('log').scrollHeight; });
}
$('logTabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-unit]');
  if (b) showLog(b.dataset.unit);
});
$('lines').addEventListener('change', refreshLog);

async function act(url, label, confirmText, btn, msg) {
  if (!confirm(confirmText)) return;
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = `${label}…`;
  try {
    const r = await fetch(url, { method: 'POST', headers: { 'X-Dashboard': '1' } });
    const d = await r.json();
    if (msg) msg.textContent = d.ok ? '' : `${label} failed: ${d.error}`;
    else if (!d.ok) alert(`${label} failed: ${d.error}`);
  } catch (e) {
    // Restarting the dashboard itself drops the connection before it can answer; the next refresh reconnects
  }
  btn.disabled = false;
  btn.textContent = original;
  refresh();
  refreshLog();
}
$('projects').addEventListener('click', (e) => {
  const b = e.target.closest('[data-restart]');
  if (b) return act(`/api/restart?service=${encodeURIComponent(b.dataset.restart)}`, 'Restarting', `Restart ${b.dataset.name}?`, b);
  const row = e.target.closest('.prow');
  if (row) showLog(row.dataset.unit);
});
$('update').addEventListener('click', () =>
  act('/api/update', 'Updating', 'Check GitHub and deploy new commits for every project now?', $('update'), $('updateMsg')));

refresh().then(() => refreshLog()).then(() => { $('log').scrollTop = $('log').scrollHeight; });
setInterval(refresh, 10_000);
setInterval(refreshLog, 10_000);
</script>
</body>
</html>
